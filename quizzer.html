<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>QUIZZER</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="main.js"></script>
    <style>
        :root {
            --blue: #075CE6;
            --dynamic-color: var(--blue, #075CE6);
            --input-bg: #1f2937;
            --border-color: var(--border, #333);
            --item-bg: #374151;
            --progress-bg: #374151;
        }

        body.light-theme {
            --input-bg: #ffffff;
            --border-color: var(--border, #d1d5db);
            --item-bg: #d1d5db;
            --progress-bg: #d1d5db;
        }

        @keyframes fadeInScale { from { opacity: 0; transform: scale(.9) } to { opacity: 1; transform: scale(1) } }
        .animate-fade-in-scale { animation: fadeInScale .6s ease-out forwards }
        #progress-bar { height: 4px; border-radius: 9999px; transition: width .3s ease-in-out }
        
        .option-button.selected { box-shadow: 0 0 0 3px var(--blue, #075CE6); transform: scale(1.02); border-color: var(--blue, #075CE6) }
        
        .question-box { 
            background-color: var(--card-bg, #1a1a2a); 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            padding: 1.5rem; 
            text-align: left; 
            width: 100% 
        }

        b, strong {
            color: var(--blue, #075CE6) !important;
            font-weight: 900 !important;
        }

        .hot-place { 
            font-size: 0.95rem; 
            font-style: italic; 
            font-weight: 700; 
            color: #9ca3af; 
            margin-bottom: 1rem; 
            border-left: 3px solid var(--blue, #075CE6); 
            padding-left: 0.75rem; 
            display: block 
        }

        body, #quiz-screen * { -webkit-user-select: none; user-select: none; outline: none!important; touch-action: manipulation }
        
        .option-button { 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 600;
            background-color: var(--card-bg, #1a1a2a);
            border: 1px solid var(--border-color);
            color: var(--text-color, #ffffff);
        }

        .odd-last:last-child:nth-child(odd) { grid-column: 1 / span 2; justify-self: center; width: calc(50% - 6px); }
        #result-icon svg { width: 120px; height: 120px; margin: 0 auto; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"></button>

    <div id="main-content" class="flex flex-col items-center justify-center w-full max-w-2xl mx-auto relative text-center pb-20">
        <div id="start-screen" class="w-full max-w-lg">
            <p class="text-xl font-bold mb-4" style="color: var(--text-bright, #ffffff)">What's your name?</p>
            <input type="text" id="name-input" class="w-full px-5 py-3 rounded-xl border border-gray-600 focus:ring-2 focus:ring-[#075CE6] mb-6 text-center font-bold" style="background-color: var(--input-bg, #1f2937); color: var(--text-bright, #ffffff);">
            <button id="start-button" disabled class="w-full py-3 text-white font-extrabold rounded-xl transition-all disabled:opacity-50" style="background-color: var(--blue, #075CE6);">Start</button>
        </div>

        <div id="quiz-screen" class="hidden w-full">
            <p id="question-number" class="text-sm font-extrabold mb-2" style="color: var(--blue, #075CE6);"></p>
            <div class="w-full h-1 rounded-full mb-4 overflow-hidden" style="background-color: var(--progress-bg);"><div id="progress-bar" style="background-color: var(--blue, #075CE6); width: 0%"></div></div>
            <h2 id="instruction-text" class="text-base font-bold mb-6 opacity-80" style="color: var(--text-color, #ffffff)"></h2>
            <div class="question-box mb-8">
                <div id="question-head-box" class="hot-place hidden"></div>
                <p id="question-prompt" class="text-xl font-bold leading-relaxed" style="color: var(--text-bright, #ffffff)"></p>
            </div>
            <div id="options-container" class="grid grid-cols-2 gap-3 mb-8 w-full"></div>
            <div class="flex justify-between w-full">
                <button id="prev-button" class="px-6 py-2 rounded-xl font-bold disabled:opacity-50" style="background-color: var(--item-bg); color: var(--text-bright, #ffffff)">Previous</button>
                <button id="next-button" class="px-6 py-2 text-white font-extrabold rounded-xl disabled:opacity-50" style="background-color: var(--blue, #075CE6);">Next</button>
            </div>
        </div>

        <div id="confirmation-screen" class="hidden w-full animate-fade-in-scale">
            <h2 class="text-3xl font-extrabold mb-4" style="color: var(--text-bright, #ffffff)">Quiz Finished!</h2>
            <p class="text-xl font-bold mb-8 opacity-80" style="color: var(--text-color, #ffffff)">Are you sure you want to finish and see your results?</p>
            <div class="flex justify-between items-center w-full max-w-lg mx-auto">
                <button id="conf-prev-button" class="px-6 py-3 rounded-xl font-bold transition-all hover:-translate-y-1" style="background-color: var(--item-bg); color: var(--text-bright, #ffffff)">Go Back</button>
                <button id="finish-button" class="px-6 py-3 text-white font-extrabold rounded-xl transition-all hover:-translate-y-1" style="background-color: var(--blue, #075CE6);">Finish</button>
            </div>
        </div>

        <div id="loading-screen" class="hidden text-center w-full animate-fade-in-scale">
            <div class="inline-block h-12 w-12 animate-spin rounded-full border-4 border-solid border-current border-r-transparent align-[-0.125em]" style="color: var(--blue, #075CE6);"></div>
            <p class="text-xl font-bold mt-4 opacity-80" style="color: var(--text-color, #ffffff)">Submitting results...</p>
        </div>

        <div id="results-screen" class="hidden w-full animate-fade-in-scale">
            <div id="result-icon" class="mb-4 flex justify-center" style="color: var(--blue, #075CE6);"></div>
            <h2 id="result-title" class="text-3xl font-extrabold mb-2" style="color: var(--text-bright, #ffffff)"></h2>
            <h2 id="result-name" class="text-3xl font-extrabold mb-2" style="color: var(--blue, #075CE6);"></h2>
            <p id="result-score" class="text-xl font-bold mb-8 opacity-80" style="color: var(--text-color, #ffffff)"></p>
            <button onclick="location.reload()" class="w-full py-3 text-white font-extrabold rounded-xl transition-all hover:-translate-y-1" style="background-color: var(--blue, #075CE6);">Play Again</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const icons = {
                trophy: `<svg viewBox="0 0 64 64" fill="currentColor"><path d="M60,6h-7V4c0-2.211-1.789-4-4-4H15c-2.211,0-4,1.789-4,4v2H4c-2.211,0-4,1.789-4,4v8c0,6.075,4.925,11,11,11h0.096C12.01,38.66,19.477,46.396,29,47.762V56h-7c-2.211,0-4,1.789-4,4v3c0,0.553,0.447,1,1,1h26c0.553,0,1-0.447,1-1v-3c0-2.211-1.789-4-4-4h-7v-8.238C44.523,46.396,51.99,38.66,52.904,29H53c6.075,0,11-4.925,11-11v-8C64,7.789,62.211,6,60,6z M6,18v-6h5v11C8.238,23,6,20.762,6,18z M39.712,21.048l-3.146,3.227l0.745,4.564c0.062,0.378-0.099,0.758-0.411,0.979C36.728,29.938,36.525,30,36.323,30c-0.166,0-0.333-0.041-0.484-0.125l-3.841-2.123l-3.841,2.123c-0.336,0.186-0.748,0.163-1.061-0.058s-0.473-0.601-0.411-0.979l0.745-4.564l-3.146-3.227c-0.262-0.269-0.352-0.66-0.232-1.016s0.427-0.614,0.797-0.671l4.309-0.658l1.936-4.123c0.165-0.352,0.518-0.575,0.905-0.575s0.74,0.224,0.905,0.575l1.936,4.123l4.309,0.658c0.37,0.057,0.678,0.315,0.797,0.671S39.974,20.779,39.712,21.048z M58,18c0,2.762-2.238,5-5,5V12h5V18z"></path><path fill="#FFD700" d="M33.255,20.036l-1.257-2.678l-1.257,2.678c-0.142,0.302-0.425,0.514-0.754,0.563l-2.913,0.445l2.141,2.194c0.222,0.228,0.322,0.546,0.271,0.859l-0.495,3.03l2.522-1.396c0.151-0.083,0.317-0.125,0.484-0.125s0.333,0.042,0.484,0.125l2.522,1.396l-0.495-3.03c-0.051-0.313,0.05-0.632,0.271-0.859l2.141-2.194L34.009,20.6C33.68,20.55,33.396,20.338,33.255,20.036z"></path></svg>`,
                thumbsUp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`,
                smileyFace: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>`,
                sadFace: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 16s-1.5-2-4-2-4 2-4 2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>`
            };
            const urlParams = new URLSearchParams(window.location.search);
            let dataPath = (urlParams.get('data') || 'list/S1Q7.txt').replace('.json', '.txt');
            if (dataPath.startsWith('q/')) {
                dataPath = 'list/' + dataPath.substring(2);
            } else if (!dataPath.startsWith('list/')) {
                dataPath = 'list/' + dataPath;
            }
            let quizData = [], userName = '', currentIdx = 0, userAnswers = [], startTime, lossDurations = [], lastLoss = 0;

            const formatTime = (totalSeconds) => {
                const s = totalSeconds % 60;
                const m = Math.floor(totalSeconds / 60) % 60;
                const h = Math.floor(totalSeconds / 3600);
                let formattedTime = '';
                if (h > 0) formattedTime += `${h}h${m}m${s}s`;
                else if (m > 0) formattedTime += `${m}m${s}s`;
                else formattedTime += `${s}s`;
                return formattedTime;
            };

            const getDeviceInfo = () => {
                const userAgent = navigator.userAgent;
                let deviceType = 'Desktop/PC';
                if (/Mobi|Android/i.test(userAgent)) deviceType = 'Mobile (Android/Other)';
                else if (/iPhone|iPad|iPod/i.test(userAgent)) deviceType = 'Mobile (iOS/iPadOS)';
                else if (/Macintosh|MacIntel/i.test(userAgent) && navigator.maxTouchPoints > 1) deviceType = 'Tablet/Touchscreen Mac';
                else if (/Mac/i.test(userAgent)) deviceType = 'Macintosh';
                else if (/Windows/i.test(userAgent)) deviceType = 'Windows PC';
                else if (/Linux/i.test(userAgent)) deviceType = 'Linux/ChromeOS';
                return { deviceType: deviceType, screenResolution: `${window.screen.width}x${window.screen.height}`, userAgent: userAgent };
            };

            const generateFormattedAnswers = (useWhatsAppFormat = false) => {
                const correctSymbol = useWhatsAppFormat ? ' ✅️' : ' ✔';
                const selectedSymbol = useWhatsAppFormat ? ' ⚪️' : ' ●';
                return quizData.map((q, i) => {
                    let pText = q.rawPrompt || '';
                    pText = useWhatsAppFormat 
                        ? pText.split('[').join('*').split(']').join('*') 
                        : pText; // Keep brackets for Formspree
                    
                    let questionDetail = `Q${i + 1}: ${pText}`;
                    
                    let correctAnswers = q.correct;
                    let selectedAnswers = userAnswers[i];
                    let optionList = q.options.map(option => {
                        let status = '';
                        if (correctAnswers.includes(option.id)) status += correctSymbol;
                        if (selectedAnswers.includes(option.id)) status += selectedSymbol;
                        
                        let optText = option.raw || '';
                        optText = useWhatsAppFormat 
                            ? optText.split('[').join('*').split(']').join('*') 
                            : optText; // Keep brackets for Formspree
                        
                        return `- ${optText}${status}`;
                    }).join('\n');
                    return questionDetail + '\n\n' + optionList;
                }).join('\n------------------------\n');
            };

            const generateWhatsAppMessage = (score, total, percentage, detailedAnswers) => {
                const quizTitle = "*Quiz Results*";
                const message = `\n${quizTitle}\n\n*Name:* ${userName}\n*Score:* ${score}/${total} (${parseFloat(percentage.toFixed(2))}%)\n\n------------------------\n${detailedAnswers}\n`.trim();
                return encodeURIComponent(message);
            };

            const calculateAndPrepareResults = () => {
                let score = 0;
                quizData.forEach((q, i) => {
                    const correctMatches = userAnswers[i].filter(v => q.correct.includes(v)).length;
                    score += (correctMatches / q.correct.length);
                });
                score = (score % 1 === 0) ? score : parseFloat(score.toFixed(2));

                const total = quizData.length;
                const percentage = (score / total) * 100;
                const formattedScore = `${score}/${total} (${parseFloat(percentage.toFixed(2))}%)`;
                const timeTakenRawSec = Math.round((Date.now() - startTime) / 1000); 
                
                const totalLostFocusMs = lossDurations.reduce((a, b) => a + b, 0);
                const totalLostFocusSec = Math.round(totalLostFocusMs / 1000); 
                const individualLossesSec = lossDurations.map(ms => Math.round(ms / 1000));
                
                const formattedTotalTime = formatTime(timeTakenRawSec);

                let cheatingAttempts;
                if (lossDurations.length === 0) {
                    cheatingAttempts = "0 times, for 0s (No recorded switches)";
                } else {
                    const formattedLostFocusTime = formatTime(totalLostFocusSec);
                    const individualTimesStr = individualLossesSec.length > 0 ? ` (${individualLossesSec.join('+')}s)` : '';
                    cheatingAttempts = `${lossDurations.length} times, for ${formattedLostFocusTime}${individualTimesStr}`;
                }

                const deviceInfo = getDeviceInfo();
                const deviceInformationBlock = `Device Type: ${deviceInfo.deviceType}\nScreen Resolution: ${deviceInfo.screenResolution}\nUser Agent: ${deviceInfo.userAgent}`.trim();
                
                const detailedAnswersForWeb3Forms = generateFormattedAnswers(false).replace(/{/g, '"').replace(/}/g, '"');
                const detailedAnswersForWhatsApp = generateFormattedAnswers(true).replace(/{/g, '_').replace(/}/g, '_');
                const whatsappMessageForWeb3Forms = generateWhatsAppMessage(score, total, percentage, detailedAnswersForWhatsApp);
                const whatsappLinkForWeb3Forms = `https://wa.me/?text=${whatsappMessageForWeb3Forms}`;
                
                return {
                    score,
                    total,
                    percentage,
                    resultData: {
                        Name: userName,
                        Score: formattedScore,
                        Time_Taken: formattedTotalTime,
                        Detailed_Answers: detailedAnswersForWeb3Forms,
                        WhatsApp_Share_Link: whatsappLinkForWeb3Forms,
                        'Tab switches': cheatingAttempts,
                        'Device Information': deviceInformationBlock,
                        Timestamp: new Date().toISOString()
                    }
                };
            };

            const attemptSubmission = async (data) => {
                if (!navigator.onLine) {
                    setTimeout(() => attemptSubmission(data), 5000);
                    return;
                }
                try {
                    const response = await fetch("https://formspree.io/f/mzzkwywd", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data.resultData),
                    });
                    if (response.ok) {
                        document.getElementById('loading-screen').classList.add('hidden');
                        document.getElementById('results-screen').classList.remove('hidden');
                        const perc = data.percentage;
                        document.getElementById('result-icon').innerHTML = perc === 100 ? icons.trophy : perc >= 75 ? icons.thumbsUp : perc >= 50 ? icons.smileyFace : icons.sadFace;
                        document.getElementById('result-title').textContent = perc === 100 ? "Excellent!" : perc >= 75 ? "Good Job!" : perc >= 50 ? "Not Bad!" : "Keep Practicing!";
                        document.getElementById('result-name').textContent = userName;
                        document.getElementById('result-score').textContent = `You scored ${data.score} out of ${data.total} (${parseFloat(perc.toFixed(2))}%)`;
                    } else {
                        setTimeout(() => attemptSubmission(data), 2000);
                    }
                } catch (error) {
                    setTimeout(() => attemptSubmission(data), 2000);
                }
            };

            const handleFocusLoss = () => {
                if (document.getElementById('quiz-screen').classList.contains('hidden')) return;
                if (lastLoss === 0) lastLoss = Date.now();
            };

            const handleFocusGain = () => {
                if (lastLoss > 0) { 
                    lossDurations.push(Date.now() - lastLoss); 
                    lastLoss = 0; 
                }
            };

            window.addEventListener('blur', handleFocusLoss);
            window.addEventListener('focus', handleFocusGain);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) handleFocusLoss();
                else handleFocusGain();
            });

            // Fisher-Yates Shuffle Helper Function
            const shuffleArray = (array) => {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            };

            const qm = (urlParams.get('data') || '').match(/^([a-z0-9]{6})\.q$/i);
            if (qm) {
                try {
                    const lt = await (await fetch('quizzer.txt', { cache: 'no-store' })).text();
                    const hit = lt.split('\n').map(l => l.trim()).find(l => l.toLowerCase().startsWith(qm[1].toLowerCase() + '|'));
                    if (hit) {
                        let rest = hit.substring(7);
                        const em = rest.match(/(\.txt|\.json|\.v|\.q)/i);
                        if (em) rest = rest.substring(0, em.index);
                        dataPath = 'list/' + rest.trim() + '.q';
                    }
                } catch (e) {}
            }
            try {
                const res = await fetch(dataPath);
                const text = await res.text();
                
                let sections = [];
                let currentSection = { head: '', limit: null, questions: [] };

                text.split('\n').filter(l => l.trim()).forEach(l => {
                    if (l.startsWith('*')) { 
                        let headText = l.substring(1).trim();
                        let limit = null;
                        
                        const match = headText.match(/^(\d+)\*(.*)/);
                        if (match) {
                            limit = parseInt(match[1], 10);
                            headText = match[2].trim();
                        }
                        
                        currentSection = { head: headText, limit: limit, questions: [] };
                        sections.push(currentSection);
                        return; 
                    }
                    
                    const p = l.split('/'); 
                    if (p.length < 3) return;
                    
                    let pr = p[0].trim(), hot = '';
                    if (pr.startsWith('{')) { const end = pr.indexOf('}'); hot = pr.substring(1, end); pr = pr.substring(end+1).trim(); }
                    
                    const opts = p.slice(2).map((o, i) => ({ 
                        text: o.trim().replace(/\{([^}]+)\}/g, '$1').split('[').join('<b>').split(']').join('</b>'), 
                        id: i + 1, 
                        raw: o.trim() 
                    }));
                    
                    if (sections.length === 0) {
                        currentSection = { head: '', limit: null, questions: [] };
                        sections.push(currentSection);
                    }
                    
                    currentSection.questions.push({ 
                        head: currentSection.head, 
                        hot: hot.replace(/\{([^}]+)\}/g, '$1').split('[').join('<b>').split(']').join('</b>'), 
                        prompt: pr.replace(/\{([^}]+)\}/g, '$1').split('[').join('<b>').split(']').join('</b>'), 
                        rawPrompt: pr,
                        correct: p[1].trim().split('.').map(Number), 
                        options: opts, 
                        revised: false 
                    });
                });

                sections.forEach(sec => {
                    // Applying Fisher-Yates instead of Math.random() - 0.5
                    shuffleArray(sec.questions);
                    
                    let selectedQuestions = sec.questions;
                    if (sec.limit !== null && sec.limit > 0) {
                        selectedQuestions = sec.questions.slice(0, sec.limit);
                    }
                    quizData.push(...selectedQuestions);
                });

                quizData.forEach(q => q.options.sort(() => Math.random() - 0.5));
            } catch (e) { console.error(e); }

            const loadQ = () => {
                const q = quizData[currentIdx];
                document.getElementById('question-number').textContent = `Question ${currentIdx + 1}/${quizData.length}`;
                document.getElementById('instruction-text').textContent = q.head || '';
                const hB = document.getElementById('question-head-box');
                if(q.hot){ hB.innerHTML = q.hot; hB.classList.remove('hidden'); } else { hB.classList.add('hidden'); }
                document.getElementById('question-prompt').innerHTML = q.prompt;
                const ct = document.getElementById('options-container'); ct.innerHTML = '';
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-button odd-last rounded-xl p-4 transition-all';
                    btn.innerHTML = opt.text;
                    if (userAnswers[currentIdx].includes(opt.id)) btn.classList.add('selected');
                    btn.onclick = () => {
                        let cur = userAnswers[currentIdx];
                        if (cur.includes(opt.id)) { userAnswers[currentIdx] = cur.filter(id => id !== opt.id); loadQ(); }
                        else if (cur.length < q.correct.length) { 
                            userAnswers[currentIdx].push(opt.id);
                            if (userAnswers[currentIdx].length === q.correct.length && !q.revised) {
                                q.revised = true; loadQ();
                                setTimeout(() => { if (currentIdx < quizData.length - 1) { currentIdx++; loadQ(); } else showConf(); }, 300);
                            } else loadQ();
                        }
                    };
                    ct.appendChild(btn);
                });
                document.getElementById('progress-bar').style.width = `${(currentIdx / (quizData.length - 1)) * 100}%`;
                document.getElementById('prev-button').disabled = currentIdx === 0;
                document.getElementById('next-button').disabled = userAnswers[currentIdx].length !== q.correct.length;
            };

            const showConf = () => { document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('confirmation-screen').classList.remove('hidden'); };

            document.getElementById('start-button').onclick = () => {
                userName = document.getElementById('name-input').value.trim();
                userAnswers = quizData.map(() => []);
                startTime = Date.now();
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                loadQ();
            };

            document.getElementById('name-input').oninput = (e) => document.getElementById('start-button').disabled = !e.target.value.trim();
            document.getElementById('next-button').onclick = () => { quizData[currentIdx].revised = true; if (currentIdx < quizData.length - 1) { currentIdx++; loadQ(); } else showConf(); };
            document.getElementById('prev-button').onclick = () => { if (currentIdx > 0) { currentIdx--; loadQ(); } };
            document.getElementById('conf-prev-button').onclick = () => { document.getElementById('confirmation-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); loadQ(); };

            document.getElementById('finish-button').onclick = () => {
                document.getElementById('confirmation-screen').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                const resultData = calculateAndPrepareResults();
                attemptSubmission(resultData);
            };
        });
    </script>
</body>
</html>
