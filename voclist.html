<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
    <title>VOCLIST</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="main.js"></script>
    <style>
        :root {
            --text-muted: #9ca3af;
            --glow: #3b82f6;
            --label-border: #374151;
        }

        body.light-theme {
            --text-muted: #6b7280;
            --glow: rgba(7, 92, 230, 0.4);
            --label-border: #d1d5db;
        }

        * { -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; outline:none!important; }
        body { transition: padding-top 0.3s; }
        
        #yg-frame-wrapper { overflow: hidden; height: 347px; border: none !important; }
        #yg-widget-0, #yg-widget-0 iframe { border: none !important; box-shadow: none !important; background: transparent !important; }

        @media (min-width: 768px) {
            #youglish-container {
                max-width: 42rem;
                left: 0;
                right: 0;
                margin: 0 auto;
            }
        }

        .arabic-text { font-family:'Noto Sans Arabic',sans-serif; direction: ltr; text-align: left; font-size: 1rem; color: var(--text-muted); display: block; }
        .english-text { font-size:1.3rem; font-weight:700; transition:all 0.3s; color:var(--text-bright); text-align: left; }
        
        .card-container { margin-bottom:1rem; border-left:5px solid var(--blue); border-radius:0.75rem; overflow:hidden; background-color:var(--card-bg); display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .word-row { padding:1rem 1.25rem; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border); transition: background 0.2s; }
        .word-row:last-child { border-bottom: none; }
        
        .word-info { display:flex; flex-direction:column; gap:2px; flex-grow:1; text-align: left; }

        .word-row.active .english-text { color: var(--blue)!important; text-shadow: 0 0 15px var(--glow); font-size: 1.5rem; }
        
        .yg-btn { 
            background: rgba(255,255,255,0.05); 
            border: none; 
            color: var(--text-muted); 
            padding: 10px; 
            border-radius: 12px; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .yg-btn:active { 
            color: var(--blue); 
            background: rgba(7, 92, 230, 0.1);
            box-shadow: 0 0 15px var(--glow); 
            transform: scale(0.9); 
        }

        .label-text { text-transform:uppercase; font-size:0.85rem; font-weight:700; color:var(--text-muted); margin:1.5rem 0 0.5rem 0.5rem; border-left:2px solid var(--label-border); padding-left:0.8rem; letter-spacing:0.05em; text-align: left; }
    </style>
    <script async src="https://youglish.com/public/emb/widget.js" charset="utf-8"></script>
</head>
<body class="p-4">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle Theme"></button>

    <div id="youglish-container" class="fixed top-0 left-0 w-full z-50 hidden border-b shadow-2xl" style="background-color: var(--bg); border-color: var(--border);">
        <div class="flex items-center p-1 px-3">
            <button onclick="closeYouglish()" class="text-lg font-bold mr-3" style="color: var(--text-muted);">✕</button>
            <span class="text-[8px] tracking-widest uppercase font-bold" style="color: var(--text-muted);">POWERED BY <span style="color: var(--blue);">YOUGLISH.COM</span></span>
        </div>
        <div id="yg-frame-wrapper"><div id="yg-widget-0"></div></div>
    </div>

    <div id="vocabulary-list" class="max-w-2xl mx-auto"></div>

    <script>
        let ygWidget;

        const mainToggleTheme = window.toggleTheme;
        window.toggleTheme = function() {
            if (typeof mainToggleTheme === 'function') {
                mainToggleTheme();
            } else {
                document.body.classList.toggle('light-theme');
            }
            if (ygWidget) {
                ygWidget.close();
                onYouglishAPIReady();
            }
        };

        function onYouglishAPIReady() {
            const isLight = document.body.classList.contains('light-theme');
            ygWidget = new YG.Widget("yg-widget-0", {
                components: 72, 
                backgroundColor: isLight ? '#f3f4f6' : '#0A0D15', 
                textColor: isLight ? '#374151' : '#dcdcdc',
                linkColor: '#075CE6',
                captionColor: isLight ? '#374151' : '#dcdcdc',
                events: { 'onFetchDone': function(e) { if(e === 0) closeYouglish(); } }
            });
        }

        function playYouglish(word) {
            const c = document.getElementById('youglish-container');
            c.classList.remove('hidden');
            document.body.style.paddingTop = c.offsetHeight + 'px';
            if (ygWidget) ygWidget.fetch(word, "english");
        }

        function closeYouglish() {
            const c = document.getElementById('youglish-container');
            c.classList.add('hidden');
            document.body.style.paddingTop = '0px';
            if (ygWidget) ygWidget.pause();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            let path = params.get('data');
            if (!path) return;
            const cm = path.match(/^([a-z0-9]{6})\.v$/i);
            if (cm) {
                try {
                    const lt = await (await fetch('voclist.txt', { cache: 'no-store' })).text();
                    const hit = lt.split('\n').map(l => l.trim()).find(l => l.toLowerCase().startsWith(cm[1].toLowerCase() + '|'));
                    if (hit) {
                        let rest = hit.substring(7);
                        const em = rest.match(/(\.txt|\.json|\.v|\.q)/i);
                        if (em) rest = rest.substring(0, em.index);
                        path = rest.trim() + '.v';
                    }
                } catch (e) {}
            }
            path = path.replace('.json', '.txt');
            if (path.startsWith('v/')) {
                path = 'list/' + path.substring(2);
            } else if (!path.startsWith('list/')) {
                path = 'list/' + path;
            }
            try {
                const res = await fetch(path);
                const text = await res.text();
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const list = document.getElementById('vocabulary-list');
                
                const pronounce = (w) => {
                    let n = w.toLowerCase().replace(/[()]/g,'').replace(/[^a-z0-9.]/g,'_');
                    new Audio(`audio/${n}.mp3`).play().catch(()=>{});
                };

                lines.forEach(line => {
                    if (line.startsWith('*')) {
                        const d = document.createElement('div');
                        d.className = 'label-text';
                        d.innerText = line.substring(1);
                        list.appendChild(d);
                        return;
                    }

                    const parts = line.split(',');
                    const container = document.createElement('div');
                    container.className = 'card-container';
                    
                    for (let i = 0; i < parts.length; i += 2) {
                        const eng = parts[i].trim();
                        const arb = parts[i+1] ? parts[i+1].trim() : '';
                        
                        const row = document.createElement('div');
                        row.className = 'word-row';
                        row.innerHTML = `
                            <div class="word-info">
                                <span class="english-text">${eng.replace(/\.[a-z]+$/, '')}</span>
                                <span class="arabic-text">${arb}</span>
                            </div>
                            <button class="yg-btn">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3L20 12L6 21V3Z" stroke-linejoin="round" fill="currentColor" fill-opacity="0.1"></path>
                                </svg>
                            </button>
                        `;

                        row.onclick = (e) => {
                            if (e.target.closest('button')) return;
                            document.querySelectorAll('.word-row').forEach(r => r.classList.remove('active'));
                            row.classList.add('active');
                            pronounce(eng);
                        };

                        row.querySelector('.yg-btn').onclick = (e) => {
                            e.stopPropagation();
                            playYouglish(eng.replace(/\.[a-z]+$/, ''));
                        };

                        container.appendChild(row);
                    }
                    list.appendChild(container);
                });
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
