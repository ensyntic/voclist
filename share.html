<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOCLIST</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="main.js"></script>
</head>
<body class="p-6">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"></button>

    <div class="max-w-2xl mx-auto pt-8">
        <div class="text-center mb-10">
            <p class="text-[0.65rem] font-bold uppercase tracking-widest opacity-50 mb-2">VOC<span class="text-[#075CE6]">LIST</span></p>
            <h1 id="grade-label" class="text-3xl font-bold" style="color: var(--text-bright)"></h1>
            <p id="term-label" class="text-lg font-bold text-[#075CE6] mt-1 hidden"></p>
        </div>
        <div id="container" class="space-y-3"></div>
        <p id="empty-msg" class="text-center opacity-60 hidden">No lessons found.</p>
    </div>

    <script>
        function translateLesson(title) {
            return title
                .replace(/\bU(\d+(?:\s*-\s*\d+)?)/g, (m, g) => (g.indexOf('-') !== -1 ? 'Units ' : 'Unit ') + g)
                .replace(/\bL(\d+(?:\s*-\s*\d+)?)/g, (m, g) => (g.indexOf('-') !== -1 ? 'Lessons ' : 'Lesson ') + g);
        }

        async function init() {
            const params = new URLSearchParams(location.search);
            const stageP = params.get('stage') || 'ALL';
            const gradeP = params.get('grade') || 'ALL';
            const termP = params.get('term') || 'ALL';

            let lines = [];
            try {
                const res = await fetch('voclist.txt');
                if (res.ok) {
                    lines = (await res.text()).split('\n').map(l => l.trim()).filter(l => l.length > 0);
                }
            } catch (e) { lines = []; }

            const container = document.getElementById('container');
            let gradeLabel = '', termLabel = '', count = 0;

            lines.forEach(line => {
                let extMatch = line.match(/(\.txt|\.json|\.v|\.q)/i);
                let basePath = extMatch ? line.substring(0, extMatch.index).trim() : line;
                let cleanPath = basePath.startsWith('list/') ? basePath.substring(5) : basePath;
                let parts = cleanPath.split('/');
                let last = parts[parts.length - 1];

                let stage = 'Other', grade = 'Other', term = 'Other';
                if (parts.length > 0) {
                    let m = parts[0].match(/^([a-zA-Z\s]+)\s+(\d+.*)$/);
                    if (m) { stage = m[1].trim(); grade = 'Grade ' + m[2].trim(); }
                    else { stage = parts[0].trim(); }
                }
                if (parts.length > 1) {
                    let l2 = parts[1];
                    if (/^(Gem\s+)?Term\s+1$/i.test(l2)) term = '1st Term';
                    else if (/^(Gem\s+)?Term\s+2$/i.test(l2)) term = '2nd Term';
                    else if (/^(Gem\s+)?Term\s+3$/i.test(l2)) term = '3rd Term';
                    else term = l2.trim();
                }

                let sMatch = (stageP === 'ALL' || stage === stageP);
                let gMatch = (gradeP === 'ALL' || grade === gradeP);
                let tMatch = (termP === 'ALL' || term === termP);

                if (sMatch && gMatch && tMatch) {
                    if (!gradeLabel && gradeP !== 'ALL') gradeLabel = parts[0];
                    if (termP !== 'ALL' && !termLabel && parts.length > 1) termLabel = parts[1];
                    const div = document.createElement('div');
                    div.className = "item-card block p-5 rounded-2xl font-bold flex justify-between items-center cursor-pointer hover:opacity-90 transition";
                    div.onclick = () => window.location.href = `voclist+.html?data=${basePath}.v`;
                    div.innerHTML = `<span class="text-[1.05rem]">${translateLesson(last)}</span> <span class="text-[0.65rem] opacity-50 font-bold tracking-tighter">STUDY →</span>`;
                    container.appendChild(div);
                    count++;
                }
            });

            if (!gradeLabel) {
                if (gradeP !== 'ALL') gradeLabel = gradeP;
                else if (stageP !== 'ALL') gradeLabel = stageP;
                else gradeLabel = 'All Lessons';
            }
            document.getElementById('grade-label').textContent = gradeLabel;
            if (termP !== 'ALL' && termLabel) {
                const t = document.getElementById('term-label');
                t.textContent = termLabel;
                t.classList.remove('hidden');
            }
            if (count === 0) document.getElementById('empty-msg').classList.remove('hidden');
            document.title = gradeLabel + (termLabel ? ' - ' + termLabel : '') + ' - VOCLIST';
        }

        init();
    </script>
</body>
</html>
