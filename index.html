<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOCLIST</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="main.js"></script>
</head>
<body class="p-6">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"></button>

    <div id="auth-screen" class="max-w-md mx-auto min-h-[80vh] flex flex-col items-center justify-center">
        <div class="glass p-8 w-full text-center space-y-6">
            <h1 class="text-4xl font-bold" style="color: var(--text-bright)">Welcome to <span class="text-[#075CE6]">VOCLIST</span></h1>
            <p class="text-sm opacity-70"> </p>
            <input type="number" id="dest-code" class="w-full p-4 rounded-xl outline-none text-center font-bold tracking-widest text-l bg-[var(--select-bg)] border border-[var(--border)] text-[var(--text-bright)]" placeholder="Enter the destination code">
            <button onclick="handleCodeSubmit()" class="w-full p-4 bg-[#075CE6] text-white font-bold rounded-xl hover:opacity-90 transition">CONTINUE</button>
        </div>
    </div>

    <div id="welcome-screen" class="max-w-4xl mx-auto min-h-[80vh] flex flex-col items-center justify-center hidden">
        <h1 class="text-3xl md:text-4xl font-bold mb-12" style="color: var(--text-bright)">Select Mode</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
            <div class="choice-card p-10 md:p-12 text-center" onclick="openPortal('voc')">
                <h2 class="text-4xl md:text-5xl font-bold mb-2">VOC<span class="text-[#075CE6]">LIST</span></h2>
                <p class="text-[0.7rem] opacity-60 font-bold uppercase tracking-widest">Vocabulary Builder</p>
            </div>
            <div class="choice-card p-10 md:p-12 text-center" onclick="openPortal('quiz')">
                <h2 class="text-4xl md:text-5xl font-bold mb-2">QUIZ<span class="text-[#075CE6]">ZER</span></h2>
                <p class="text-[0.7rem] opacity-60 font-bold uppercase tracking-widest">Practice Tests</p>
            </div>
        </div>
    </div>

    <div id="portal-screen" class="max-w-2xl mx-auto hidden">
        <div class="relative flex items-center justify-center mb-10">
            <button onclick="goBack()" class="absolute left-0 text-[0.65rem] font-bold opacity-50 hover:opacity-100 tracking-tighter" style="color: var(--text)">← CHANGE MODE</button>
            <h1 id="portal-title" class="text-3xl font-bold" style="color: var(--text-bright)"></h1>
        </div>
        
        <div class="glass p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <select id="stage" class="p-3 rounded-xl outline-none">
                    <option value="ALL">All Stages</option>
                </select>
                <select id="term" class="p-3 rounded-xl outline-none">
                    <option value="ALL">All Terms</option>
                </select>
                <select id="grade" class="p-3 rounded-xl outline-none">
                    <option value="ALL">All Grades</option>
                </select>
                <button id="shareBtn" onclick="shareSelection()" class="p-3 rounded-xl bg-[#075CE6] text-white font-bold hover:opacity-90 transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>SHARE
                </button>
                <button id="downloadBtn" onclick="downloadOffline()" class="p-3 rounded-xl bg-[#075CE6] text-white font-bold hover:opacity-90 transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span id="downloadLabel">DOWNLOAD</span>
                </button>
            </div>
        </div>
        <div id="container" class="space-y-3"></div>
    </div>

    <script>
        let currentMode = ''; 
        let currentList = [];
        let parsedData = [];
        const welcome = document.getElementById('welcome-screen'), portal = document.getElementById('portal-screen'), title = document.getElementById('portal-title'), container = document.getElementById('container'), stageS = document.getElementById('stage'), termS = document.getElementById('term'), gradeS = document.getElementById('grade');
        
        function handleCodeSubmit() {
            const code = document.getElementById('dest-code').value.trim();
            if (code === '685724193' || code === '625184739') {
                document.getElementById('auth-screen').classList.add('hidden');
                welcome.classList.remove('hidden');
                return;
            }
            if (typeof decodeBarcode === 'function') {
                const decoded = decodeBarcode(code);
                if (decoded && decoded.mode) {
                    const target = decoded.mode === 'VOCLIST' ? 'v+' : 'q';
                    window.location.href = `${target}?data=list/${decoded.raw}`;
                    return;
                }
            }
            if (code.length >= 5 && /^\d+$/.test(code)) {
                const s1 = parseInt(code[0], 10);
                const target = (s1 <= 4) ? 'v+' : 'q';
                window.location.href = `${target}?data=list/${code}`;
                return;
            }
            alert('Invalid code. Please try again.');
        }

        document.getElementById('dest-code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleCodeSubmit();
            }
        });

        async function openPortal(mode) {
            currentMode = mode;
            welcome.classList.add('hidden');
            portal.classList.remove('hidden');
            document.getElementById('shareBtn').classList.toggle('hidden', mode !== 'voc');
            document.getElementById('downloadBtn').classList.toggle('hidden', mode !== 'voc');
            title.innerHTML = mode === 'voc' ? 'VOC<span style="color:var(--blue)">LIST</span>' : 'QUIZ<span style="color:var(--blue)">ZER</span>';
            const fileName = mode === 'voc' ? 'voclist.txt' : 'quizzer.txt';
            try {
                const res = await fetch(fileName, { cache: 'no-store' });
                if (res.ok) {
                    const text = await res.text();
                    currentList = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                } else { currentList = []; }
            } catch (e) { currentList = []; }
            
            parseList();
            stageS.value = 'ALL';
            termS.value = 'ALL';
            gradeS.value = 'ALL';
            updateDropdowns();
            render();
        }

        function goBack() {
            portal.classList.add('hidden');
            welcome.classList.remove('hidden');
            stageS.value = 'ALL';
            termS.value = 'ALL';
            gradeS.value = 'ALL';
        }

        function parseList() {
            parsedData = [];
            currentList.forEach(line => {
                let code = '';
                if (line.charAt(6) === '|') { code = line.substring(0, 6); line = line.substring(7).trim(); }
                let extMatch = line.match(/(\.txt|\.json|\.v|\.q)/i);
                let p = line;
                let note = '';
                let basePath = line;
                
                if (extMatch) {
                    let splitIdx = extMatch.index + extMatch[0].length;
                    p = line.substring(0, splitIdx).trim();
                    note = line.substring(splitIdx).trim();
                    basePath = p.substring(0, extMatch.index).trim();
                }

                let cleanPath = p;
                if (cleanPath.startsWith('list/')) {
                    cleanPath = cleanPath.substring(5);
                }

                let parts = cleanPath.split('/');
                if (parts.length > 0) {
                    let lastPart = parts[parts.length - 1];
                    parts[parts.length - 1] = lastPart.replace(/\.(txt|json|v|q)$/i, '');
                }
                
                let label = parts.join(' | ');
                let stage = 'Other', term = 'Other', grade = 'Other';

                if (parts.length > 0) {
                    let layer1 = parts[0];
                    let match = layer1.match(/^([a-zA-Z\s]+)\s+(\d+.*)$/);
                    if (match) {
                        stage = match[1].trim();
                        grade = 'Grade ' + match[2].trim();
                    } else {
                        stage = layer1.trim();
                    }
                }

                if (parts.length > 1) {
                    let layer2 = parts[1];
                    if (layer2.match(/^Term\s+1$/i)) term = '1st Term';
                    else if (layer2.match(/^Term\s+2$/i)) term = '2nd Term';
                    else if (layer2.match(/^Term\s+3$/i)) term = '3rd Term';
                    else term = layer2.trim();
                }

                parsedData.push({
                    basePath: basePath,
                    note: note ? ' ' + note : '',
                    stage: stage,
                    term: term,
                    grade: grade,
                    gradeName: parts[0] || grade,
                    label: label,
                    code: code
                });
            });
        }

        function updateDropdowns() {
            const sVal = stageS.value;
            const tVal = termS.value;
            const gVal = gradeS.value;

            let stages = new Set();
            let terms = new Set();
            let grades = new Map();

            parsedData.forEach(item => {
                stages.add(item.stage);
                if (sVal === 'ALL' || item.stage === sVal) {
                    if (item.term !== 'Other') terms.add(item.term);
                    if (sVal !== 'ALL' && item.grade !== 'Other') grades.set(item.grade, item.gradeName);
                }
            });

            stageS.innerHTML = '<option value="ALL">All Stages</option>';
            Array.from(stages).forEach(s => {
                stageS.innerHTML += `<option value="${s}">${s}</option>`;
            });
            stageS.value = stages.has(sVal) ? sVal : 'ALL';

            termS.innerHTML = '<option value="ALL">All Terms</option>';
            Array.from(terms).forEach(t => {
                termS.innerHTML += `<option value="${t}">${t}</option>`;
            });
            termS.value = terms.has(tVal) ? tVal : 'ALL';

            gradeS.innerHTML = '<option value="ALL">All Grades</option>';
            grades.forEach((name, g) => {
                gradeS.innerHTML += `<option value="${g}">${name}</option>`;
            });
            gradeS.disabled = sVal === 'ALL';
            gradeS.value = grades.has(gVal) ? gVal : 'ALL';
        }

        function render() {
            container.innerHTML = '';
            parsedData.forEach(item => {
                let sMatch = (stageS.value === 'ALL' || stageS.value === item.stage);
                let tMatch = (termS.value === 'ALL' || termS.value === item.term);
                let gMatch = (gradeS.value === 'ALL' || gradeS.value === item.grade);
                
                if (sMatch && tMatch && gMatch) {
                    createCard(item.basePath, item.label + item.note, item.code);
                }
            });
        }

        function createCard(p, l, code) {
            const div = document.createElement('div');
            const target = currentMode === 'voc' ? 'v+' : 'q';
            const ext = currentMode === 'voc' ? '.v' : '.q';
            div.className = "item-card block p-5 rounded-2xl font-bold flex justify-between items-center cursor-pointer hover:opacity-90 transition";
            div.onclick = () => window.location.href = `${target}?data=${code ? code : encodeURIComponent(p + ext)}`;
            div.innerHTML = `<span class="text-[1.05rem]">${l}</span> <span class="text-[0.65rem] opacity-50 font-bold tracking-tighter">${currentMode === 'voc' ? 'STUDY' : 'START'} →</span>`;
            container.appendChild(div);
        }

        let offlineBusy = false;

        async function downloadOffline() {
            if (offlineBusy) return;
            if (stageS.value === 'ALL' || gradeS.value === 'ALL') {
                alert('Select a stage and a grade first.');
                return;
            }
            const items = parsedData.filter(i => i.stage === stageS.value && i.grade === gradeS.value && (termS.value === 'ALL' || i.term === termS.value));
            if (!items.length) { alert('No lessons found.'); return; }
            const label = document.getElementById('downloadLabel');
            offlineBusy = true;
            try {
                label.textContent = '0%';
                const getText = async u => { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(u); return r.text(); };
                const [shareSrc, css, mainJs, twJs, plusSrc] = await Promise.all([getText('s.html'), getText('global.css'), getText('main.js'), getText('tailwind.js'), getText('v+.html')]);
                const toDataUrl = blob => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
                let fontCss = '';
                for (const imp of Array.from(css.matchAll(/@import url\(['"]?([^'")]+)['"]?\);/g))) {
                    try {
                        let fc = await getText(imp[1]);
                        for (const u of Array.from(new Set(Array.from(fc.matchAll(/url\(['"]?(https?:[^'")]+)['"]?\)/g)).map(m => m[1])))) {
                            const fr = await fetch(u);
                            fc = fc.split(u).join(await toDataUrl(await fr.blob()));
                        }
                        fontCss += fc;
                    } catch (e) {}
                }
                const vData = {};
                const names = new Set();
                for (const it of items) {
                    const t = await getText('list/' + it.basePath + '.v');
                    vData[it.basePath] = t;
                    t.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('*')).forEach(l => {
                        const parts = l.split(',');
                        for (let i = 0; i < parts.length; i += 2) names.add(parts[i].trim().toLowerCase().replace(/[()]/g,'').replace(/[^a-z0-9.]/g, '_'));
                    });
                }
                const queue = Array.from(names);
                const audioParts = [];
                let done = 0;
                const toB64 = blob => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.substring(fr.result.indexOf(',') + 1)); fr.readAsDataURL(blob); });
                const worker = async () => {
                    while (queue.length) {
                        const n = queue.pop();
                        try {
                            const r = await fetch('audio/' + n + '.mp3');
                            if (r.ok) {
                                const b64 = await toB64(await r.blob());
                                audioParts.push(new Blob(['<script type="text/plain" data-a="' + n + '">', b64, '<\/script>\n']));
                            }
                        } catch (e) {}
                        done++;
                        label.textContent = Math.floor(done / names.size * 100) + '%';
                    }
                };
                await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);

                const safe = t => t.replace(/<\/script/gi, '<\\/script');
                const swap = (src, from, to) => { if (src.indexOf(from) === -1) throw new Error('template'); return src.split(from).join(to); };
                const offline = { q: 'stage=' + encodeURIComponent(stageS.value) + '&grade=' + encodeURIComponent(gradeS.value) + '&term=' + encodeURIComponent(termS.value), txt: items.map(i => i.basePath + '.v').join('\n'), v: vData };
                const plusCss = (plusSrc.match(/<style>([\s\S]*?)<\/style>/) || ['', ''])[1];
                let html = shareSrc;
                html = swap(html, '<link rel="stylesheet" href="global.css">', '<style>' + fontCss + '</style><style>' + css.replace(/@import url\([^)]*\);/g, '') + '</style><style>' + plusCss + '</style>');
                html = swap(html, '<script src="https://cdn.tailwindcss.com"><\/script>', '<script>' + safe(twJs) + '<\/script>');
                html = swap(html, '<script src="main.js"><\/script>', '<script>' + safe(mainJs) + '<\/script>');
                html = swap(html, 'new URLSearchParams(location.search)', 'new URLSearchParams(OFFLINE.q)');
                html = swap(html, "fetch('voclist.txt', { cache: 'no-store' })", 'Promise.resolve(new Response(OFFLINE.txt))');
                html = swap(html, 'window.location.href = `v+?data=${code ? code : encodeURIComponent(basePath + \'.v\')}`', 'openLesson(basePath)');
                html = swap(html, '</head>', '<script>var OFFLINE=' + JSON.stringify(offline).replace(/</g, '\\u003c') + ';<\/script></head>');
                const study = `<div id="study" class="hidden">
<div id="vocabulary-list" class="max-w-2xl mx-auto"></div></div>
<script>
function openLesson(basePath) {
    const text = OFFLINE.v[basePath] || '';
    const lines = text.split('\\n').map(l => l.trim()).filter(l => l.length > 0);
    const list = document.getElementById('vocabulary-list');
    list.innerHTML = '';
    const pronounce = (w) => {
        let n = w.toLowerCase().replace(/[()]/g,'').replace(/[^a-z0-9.]/g, '_');
        const el = document.querySelector('script[data-a="' + n + '"]');
        if (el) new Audio('data:audio/mpeg;base64,' + el.textContent).play().catch(() => {});
    };
    lines.forEach(line => {
        if (line.startsWith('*')) {
            const d = document.createElement('div');
            d.className = 'label-text';
            d.innerText = line.substring(1);
            list.appendChild(d);
            return;
        }
        const parts = line.split(',');
        const container = document.createElement('div');
        container.className = 'card-container';
        for (let i = 0; i < parts.length; i += 2) {
            const eng = parts[i].trim();
            const arb = parts[i + 1] ? parts[i + 1].trim() : '';
            const row = document.createElement('div');
            row.className = 'word-row';
            row.innerHTML = '<div class="word-info"><span class="english-text">' + eng.replace(/\\.[a-z]+$/, '') + '</span><span class="arabic-text">' + arb + '</span></div>';
            row.onclick = () => {
                document.querySelectorAll('.word-row').forEach(r => r.classList.remove('active'));
                row.classList.add('active');
                pronounce(eng);
            };
            container.appendChild(row);
        }
        list.appendChild(container);
    });
    document.querySelector('body > .max-w-2xl').classList.add('hidden');
    document.getElementById('study').classList.remove('hidden');
    document.body.classList.replace('p-6', 'p-4');
    document.querySelector('meta[name=viewport]').content = 'width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0';
    if (location.hash !== '#lesson') location.hash = 'lesson';
    window.scrollTo(0, 0);
}
function closeLesson() {
    document.getElementById('study').classList.add('hidden');
    document.querySelector('body > .max-w-2xl').classList.remove('hidden');
    document.body.classList.replace('p-4', 'p-6');
    document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=1.0';
}
window.addEventListener('hashchange', () => { if (location.hash !== '#lesson') closeLesson(); });
<\/script>
`;
                const bi = html.lastIndexOf('</body>');
                if (bi === -1) throw new Error('template');
                const first = items[0].basePath.split('/');
                const fileName = 'VOCLIST ' + first[0] + (termS.value !== 'ALL' && first.length > 1 ? ' ' + first[1] : '') + '.html';
                const blob = new Blob([html.substring(0, bi), study].concat(audioParts, [html.substring(bi)]), { type: 'text/html' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 60000);
            } catch (e) {
                alert('Download failed. Check your connection and try again.');
            }
            label.textContent = 'DOWNLOAD';
            offlineBusy = false;
        }

        function shareSelection() {
            if (stageS.value === 'ALL' || gradeS.value === 'ALL') {
                alert('Select a stage and a grade first.');
                return;
            }
            const first = parsedData.find(i => i.stage === stageS.value && i.grade === gradeS.value && (termS.value === 'ALL' || i.term === termS.value) && i.code);
            if (!first) { alert('No lessons found.'); return; }
            const url = location.href.substring(0, location.href.lastIndexOf('/') + 1) + (termS.value === 'ALL' ? 's+' : 's') + '?data=' + first.code;
            if (navigator.share) {
                navigator.share({ title: 'VOCLIST', url: url }).catch(() => {});
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => alert('Link copied to clipboard.'));
            } else {
                prompt('Copy this link:', url);
            }
        }

        stageS.onchange = () => { updateDropdowns(); render(); };
        termS.onchange = render; 
        gradeS.onchange = render;
    </script>
</body>
</html>
